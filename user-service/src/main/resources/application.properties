spring.application.name=user-service
spring.profiles.active=dev

# Own port, own context-path — mirrors the monolith's /api/auth/... contract
# exactly, so a future gateway can route /api/auth/** here with zero path
# rewriting.
server.port=${PORT:8082}
server.servlet.context-path=/api

# Own database: same Postgres container/instance as the monolith, but a
# SEPARATE database (ecommerce_users) inside it — not a shared schema, no
# cross-database FK to the monolith's `products`/`orders` tables is possible
# or intended. This is the "same container, new database" staging point on
# the road to a fully separate instance in AWS later.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Same JWT secret/expiration shape as the monolith. MUST be the same actual
# value across every service once more than one of them validates tokens —
# set JWT_SECRET as one shared env var, not a per-service default, from
# cart-service onward.
jwt.secret=${JWT_SECRET:ecommerce-super-secret-key-change-in-production-must-be-long}
jwt.expiration=86400000

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}

# Where to reach notification-service for the welcome email call
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.com.ecommerce=DEBUG
