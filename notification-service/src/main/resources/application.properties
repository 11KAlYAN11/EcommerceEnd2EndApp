spring.application.name=notification-service

# Own port — 8081. Monolith stays on 8080. Once the gateway exists (later in
# Phase 16) it routes /notifications/** here; for now you call this port directly.
# No context-path here (unlike the monolith's /api) — NotificationController
# already declares the full path via @RequestMapping("/api/notifications"),
# so adding a context-path on top would double it up for no reason.
server.port=${PORT:8081}

# Same Gmail SMTP setup as the monolith (problems-overcomed.md #: use an App
# Password, not your real Gmail password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:programmer143143@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.address=${MAIL_USERNAME:programmer143143@gmail.com}
mail.from.name=EcommerceApp

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# No real mail server reachable in some dev setups — don't fail health check on it
management.health.mail.enabled=false

logging.level.com.ecommerce.notification=DEBUG
