spring.application.name=product-service
server.port=${PORT:8083}
server.servlet.context-path=/api

# Own database, same Postgres container/instance as the others
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_products}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Same Redis instance as the monolith, DIFFERENT logical DB index (1, not 0)
# so cache keys like "products::all" don't collide with the monolith's.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:1}
cache.ttl.products=600
cache.ttl.categories=1800

# Same shared secret as user-service — this service only validates, never issues
jwt.secret=${JWT_SECRET:ecommerce-super-secret-key-change-in-production-must-be-long}

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Redis is an optional cache layer (ADR B-10) -- CacheConfig already falls
# back to in-memory if unreachable, so a down Redis shouldn't flip this
# service's own health to DOWN.
management.health.redis.enabled=false

logging.level.com.ecommerce=DEBUG
