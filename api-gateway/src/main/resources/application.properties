spring.application.name=api-gateway

# 9000, not 8080 -- the monolith is still on 8080 and stays reachable in
# parallel until it's decommissioned. This is the NEW single entry point.
server.port=${PORT:9000}

services.user.base-url=${USER_SERVICE_URL:http://localhost:8082}
services.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8083}
services.cart.base-url=${CART_SERVICE_URL:http://localhost:8084}
services.order.base-url=${ORDER_SERVICE_URL:http://localhost:8085}
services.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8086}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized

logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
