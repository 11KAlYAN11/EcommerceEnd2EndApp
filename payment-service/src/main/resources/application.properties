spring.application.name=payment-service
server.port=${PORT:8086}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_payments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ecommerce-super-secret-key-change-in-production-must-be-long}

services.order.base-url=${ORDER_SERVICE_URL:http://localhost:8085}

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.com.ecommerce=DEBUG
